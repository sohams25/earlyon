<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="earlyon Python session. An easy input (car_closeup) exits at head 0 using 12% of compute; a hard input (blurry_bird) takes no head and runs the full network." font-family="ui-monospace, Menlo, Consolas, monospace">
  <title>earlyon — inference session</title>
  <desc>Looping Python REPL. Beat 1: an easy input exits at head 0, using 12% of the network. Beat 2: a hard input takes no head and runs to the final classifier. A spine diagram beside it lights the short path, then the full path.</desc>

  <!-- accent = exited early / compute saved; neutral = ran everything -->
  <defs>
    <marker id="tip-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#56B98A"/>
    </marker>
    <marker id="tip-neutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B949E"/>
    </marker>

    <!-- typewriter masks: each rect grows from 0 to the measured text extent -->
    <clipPath id="type-b1-cmd1"><rect x="118" y="110" width="590" height="32"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.05;0.1417;0.5;0.52;1" values="0;0;590;590;0;0"/></rect></clipPath>
    <clipPath id="type-b1-cmd2"><rect x="118" y="154" width="680" height="32"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.175;0.2667;0.5;0.52;1" values="0;0;680;680;0;0"/></rect></clipPath>
    <clipPath id="type-b2-cmd1"><rect x="118" y="110" width="590" height="32"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.55;0.6417;0.9917;0.9958;1" values="0;0;590;590;0;0"/></rect></clipPath>
    <clipPath id="type-b2-cmd2"><rect x="118" y="154" width="680" height="32"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.675;0.7667;0.9917;0.9958;1" values="0;0;680;680;0;0"/></rect></clipPath>
  </defs>

  <!-- page-matching frame + slightly lighter terminal card with a 1px border -->
  <rect x="0" y="0" width="1200" height="520" fill="#0D1117"/>
  <rect x="24" y="24" width="1152" height="472" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>

  <!-- window chrome: monochrome dots, no decorative color -->
  <circle cx="54" cy="52" r="6" fill="none" stroke="#4A525C" stroke-width="1.5"/>
  <circle cx="78" cy="52" r="6" fill="none" stroke="#4A525C" stroke-width="1.5"/>
  <circle cx="102" cy="52" r="6" fill="none" stroke="#4A525C" stroke-width="1.5"/>
  <line x1="24" y1="80" x2="1176" y2="80" stroke="#30363D" stroke-width="1.5"/>

  <!-- persistent prompts; commands type in after them -->
  <text x="56" y="132" font-size="24" fill="#6E7681">&gt;&gt;&gt;</text>
  <text x="56" y="176" font-size="24" fill="#6E7681">&gt;&gt;&gt;</text>
  <text x="56" y="308" font-size="24" fill="#6E7681">&gt;&gt;&gt;</text>
  <rect x="120" y="290" width="11" height="24" fill="#E6EDF3">
    <animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="1;0"/>
  </rect>

  <!-- ===== BEAT 1 — easy input, exits at head 0 ===== -->
  <g opacity="1">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.0167;0.0417;0.4667;0.5;1" values="0;0;1;1;0;0"/>
    <text x="118" y="132" font-size="24" fill="#E6EDF3" clip-path="url(#type-b1-cmd1)">r = model(car_closeup, mode="inference")</text>
    <text x="118" y="176" font-size="24" fill="#E6EDF3" clip-path="url(#type-b1-cmd2)">r.exit_taken, r.computation_used, r.confidence</text>
    <text x="56" y="220" font-size="24" fill="#E6EDF3" opacity="0">(0, 0.12, 0.97)<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.2833;0.30;0.5;0.52;1" values="0;0;1;1;0;0"/></text>
    <text x="56" y="264" font-size="20" fill="#56B98A" opacity="0"># confident at the first head. 88% of the network never ran.<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.333;0.35;0.5;0.52;1" values="0;0;1;1;0;0"/></text>
  </g>

  <!-- ===== BEAT 2 — hard input, no head fires, full network ===== -->
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.5;0.5333;0.9583;0.9917;1" values="0;0;1;1;0;0"/>
    <text x="118" y="132" font-size="24" fill="#E6EDF3" clip-path="url(#type-b2-cmd1)">r = model(blurry_bird, mode="inference")</text>
    <text x="118" y="176" font-size="24" fill="#E6EDF3" clip-path="url(#type-b2-cmd2)">r.exit_taken, r.computation_used, r.confidence</text>
    <text x="56" y="220" font-size="24" fill="#E6EDF3" opacity="0">(-1, 1.00, 0.91)<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.7917;0.8083;0.9917;0.9958;1" values="0;0;1;1;0;0"/></text>
    <text x="56" y="264" font-size="20" fill="#8B949E" opacity="0"># no head was sure enough. hard inputs go the distance.<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.8417;0.8583;0.9917;0.9958;1" values="0;0;1;1;0;0"/></text>
  </g>

  <line x1="56" y1="350" x2="1144" y2="350" stroke="#30363D" stroke-width="1.5"/>

  <!-- ===== backbone spine, synced to the beats ===== -->
  <!-- faint base: whole network always drawn; lit paths sit on top -->
  <g fill="none" stroke="#4A525C">
    <line x1="40" y1="404" x2="76" y2="404" stroke-width="2"/>
    <line x1="236" y1="404" x2="336" y2="404" stroke-width="2"/>
    <line x1="496" y1="404" x2="596" y2="404" stroke-width="2"/>
    <line x1="756" y1="404" x2="856" y2="404" stroke-width="2"/>
    <line x1="286" y1="404" x2="286" y2="442" stroke-width="2"/>
    <line x1="546" y1="404" x2="546" y2="442" stroke-width="2"/>
    <line x1="806" y1="404" x2="806" y2="442" stroke-width="2"/>
    <rect x="76" y="378" width="160" height="52" rx="6" stroke-width="1.5"/>
    <rect x="336" y="378" width="160" height="52" rx="6" stroke-width="1.5"/>
    <rect x="596" y="378" width="160" height="52" rx="6" stroke-width="1.5"/>
    <rect x="856" y="378" width="280" height="52" rx="6" stroke-width="1.5"/>
    <rect x="216" y="442" width="140" height="36" rx="6" stroke-width="1.5"/>
    <rect x="476" y="442" width="140" height="36" rx="6" stroke-width="1.5"/>
    <rect x="736" y="442" width="140" height="36" rx="6" stroke-width="1.5"/>
  </g>

  <!-- beat 1: short path lights — input, layer1, exit 0 -->
  <g opacity="1">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.0167;0.0417;0.4667;0.5;1" values="0;0;1;1;0;0"/>
    <line x1="40" y1="404" x2="76" y2="404" stroke="#56B98A" stroke-width="2.5" marker-end="url(#tip-accent)"/>
    <rect x="76" y="378" width="160" height="52" rx="6" fill="#16241D" stroke="#56B98A" stroke-width="2"/>
    <line x1="236" y1="404" x2="286" y2="404" stroke="#56B98A" stroke-width="2.5"/>
    <line x1="286" y1="404" x2="286" y2="442" stroke="#56B98A" stroke-width="2.5" marker-end="url(#tip-accent)"/>
    <rect x="216" y="442" width="140" height="36" rx="6" fill="#16241D" stroke="#56B98A" stroke-width="2"/>
  </g>

  <!-- beat 2: full path lights — every layer runs to the classifier, no head taken -->
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.5;0.5333;0.9583;0.9917;1" values="0;0;1;1;0;0"/>
    <line x1="40" y1="404" x2="76" y2="404" stroke="#8B949E" stroke-width="2.5" marker-end="url(#tip-neutral)"/>
    <rect x="76" y="378" width="160" height="52" rx="6" fill="#1C222B" stroke="#8B949E" stroke-width="2"/>
    <line x1="236" y1="404" x2="336" y2="404" stroke="#8B949E" stroke-width="2.5"/>
    <rect x="336" y="378" width="160" height="52" rx="6" fill="#1C222B" stroke="#8B949E" stroke-width="2"/>
    <line x1="496" y1="404" x2="596" y2="404" stroke="#8B949E" stroke-width="2.5"/>
    <rect x="596" y="378" width="160" height="52" rx="6" fill="#1C222B" stroke="#8B949E" stroke-width="2"/>
    <line x1="756" y1="404" x2="856" y2="404" stroke="#8B949E" stroke-width="2.5" marker-end="url(#tip-neutral)"/>
    <rect x="856" y="378" width="280" height="52" rx="6" fill="#1C222B" stroke="#8B949E" stroke-width="2"/>
  </g>

  <!-- labels above every fill; one text per column, explicit x -->
  <g font-size="20" fill="#8B949E" text-anchor="middle">
    <text x="156" y="411">layer1</text>
    <text x="416" y="411">layer2</text>
    <text x="676" y="411">layer3</text>
    <text x="996" y="411">layer4 + classifier</text>
  </g>
  <g font-size="19" fill="#8B949E">
    <text x="232" y="465">exit 0</text>
    <text x="346" y="465" text-anchor="end">12%</text>
    <text x="492" y="465">exit 1</text>
    <text x="606" y="465" text-anchor="end">40%</text>
    <text x="752" y="465">exit 2</text>
    <text x="866" y="465" text-anchor="end">74%</text>
  </g>
</svg>
