<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="earlyon: early-exit inference for PyTorch CV models. An easy input enters layer1 and leaves at exit 0, using 12% of the network; layer2, layer3 and layer4 stay unused." font-family="ui-monospace, Menlo, Consolas, monospace">
  <title>earlyon</title>
  <desc>Masthead for earlyon. An easy input enters layer1 and leaves the network at exit 0 (12% of compute); layer2, layer3 and layer4 stay unused.</desc>

  <!-- accent = exited early / compute saved; neutral = ran everything -->
  <defs>
    <marker id="head-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#12805A"/>
    </marker>
    <marker id="head-neutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B867D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="400" fill="#FAF8F4"/>

  <!-- masthead -->
  <text x="70" y="122" font-size="74" font-weight="700" letter-spacing="-2" fill="#1C1B19">earlyon</text>
  <text x="73" y="162" font-size="25" fill="#75716A">Early-exit inference for PyTorch CV models.</text>
  <line x1="72" y1="196" x2="1116" y2="196" stroke="#E6E1D8" stroke-width="1.5"/>

  <!-- ===== backbone spine ===== -->
  <!-- unused remainder: layer2 -> layer3 -> layer4, dashed neutral -->
  <g>
    <line x1="266" y1="262" x2="336" y2="262" stroke="#B9B3A8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#head-neutral)"/>
    <line x1="506" y1="262" x2="576" y2="262" stroke="#B9B3A8" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="746" y1="262" x2="816" y2="262" stroke="#B9B3A8" stroke-width="2" stroke-dasharray="6 5"/>

    <rect x="336" y="232" width="170" height="60" rx="6" fill="#EFECE5" stroke="#C7C0B4" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="576" y="232" width="170" height="60" rx="6" fill="#EFECE5" stroke="#C7C0B4" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="816" y="232" width="300" height="60" rx="6" fill="#EFECE5" stroke="#C7C0B4" stroke-width="1.5" stroke-dasharray="6 5"/>

    <text x="421" y="270" font-size="22" text-anchor="middle" fill="#8B867D">layer2</text>
    <text x="661" y="270" font-size="22" text-anchor="middle" fill="#8B867D">layer3</text>
    <text x="966" y="270" font-size="20" text-anchor="middle" fill="#8B867D">layer4 + classifier</text>
  </g>

  <!-- taken path: input -> layer1 -> exit 0, solid accent -->
  <g>
    <line x1="40" y1="262" x2="96" y2="262" stroke="#12805A" stroke-width="2.5" marker-end="url(#head-accent)"/>
    <line x1="181" y1="292" x2="181" y2="330" stroke="#12805A" stroke-width="2.5" marker-end="url(#head-accent)"/>

    <rect x="96" y="232" width="170" height="60" rx="6" fill="#FFFFFF" stroke="#12805A" stroke-width="2"/>
    <text x="181" y="270" font-size="22" text-anchor="middle" fill="#1C1B19">layer1</text>

    <rect x="101" y="332" width="160" height="56" rx="6" fill="#E6F1EA" stroke="#12805A" stroke-width="2"/>
    <text x="119" y="366" font-size="22" fill="#12805A">exit 0</text>
    <text x="243" y="366" font-size="20" text-anchor="end" fill="#12805A">12%</text>
  </g>
</svg>
